# The extension ships with no runtime dependencies, so this watches the build
# toolchain and the Actions used by CI and the release pipeline.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']
    # Both type packages state the compatibility floor rather than track the
    # newest release: @types/vscode has to equal engines.vscode, and @types/node
    # has to stay on the major that VS Code 1.85 ships. Raising either lets the
    # compiler accept APIs that are absent on the oldest editor we support, and
    # nothing in CI would catch it. They move when the floor moves.
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: ''

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ''
