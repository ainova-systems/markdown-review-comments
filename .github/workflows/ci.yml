# CI: the project's correctness gate (`npm run verify` = strict tsc + the unit
# suite), plus the packaging checks that a release depends on. The Markdown
# engine has no vscode dependency, so everything runs headless on Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor VS Code 1.85 ships; 22 is the current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (compile + tests)
        run: npm run verify

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vsce ignores .gitignore once a .vscodeignore exists, so this is the only
      # thing standing between a new directory and every user's machine.
      - name: Check VSIX contents
        run: node scripts/check-package-contents.mjs

      - name: Package
        run: npx vsce package --out markdown-review-comments-ci.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: '*.vsix'
