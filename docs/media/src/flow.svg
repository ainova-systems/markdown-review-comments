<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="436" viewBox="0 0 1280 436">
  <rect width="1280" height="436" fill="#1B202C"/>
  <text x="48" y="56" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#F0F4FF">The review loop, without leaving the file</text>
  <text x="48" y="88" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="18" fill="#7B87A6">Every step is a plain-text edit you can read, diff and review.</text>
  <rect x="48" y="108" width="373" height="284" rx="14" fill="#232838" stroke="#333A4E"/>
  <circle cx="94" cy="158" r="20" fill="#7FA8FF"/>
  <text x="94" y="165" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B202C">1</text>
  <text x="128" y="165" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F0F4FF">Comment</text>
  <text x="74" y="224" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">Hover the gutter, click +, type</text>
  <text x="74" y="250" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">the note below the line.</text>
  <text x="74" y="276" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve"></text>
  <text x="74" y="302" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">An anchor goes into the source,</text>
  <text x="74" y="328" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">the note into the section at the</text>
  <text x="74" y="354" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">bottom of the same file.</text>
  <rect x="453" y="108" width="373" height="284" rx="14" fill="#232838" stroke="#333A4E"/>
  <circle cx="499" cy="158" r="20" fill="#7FA8FF"/>
  <text x="499" y="165" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B202C">2</text>
  <text x="533" y="165" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F0F4FF">Hand it to an agent</text>
  <text x="479" y="224" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">Claude, Copilot or Cursor reads</text>
  <text x="479" y="250" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">the file it was already given.</text>
  <text x="479" y="276" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve"></text>
  <text x="479" y="302" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">Plain Markdown - no JSON, no</text>
  <text x="479" y="328" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">hidden metadata. The review is</text>
  <text x="479" y="354" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">part of the document.</text>
  <rect x="858" y="108" width="373" height="284" rx="14" fill="#232838" stroke="#333A4E"/>
  <circle cx="904" cy="158" r="20" fill="#7FA8FF"/>
  <text x="904" y="165" text-anchor="middle" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B202C">3</text>
  <text x="938" y="165" font-family="&quot;Segoe UI&quot;, &quot;DejaVu Sans&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F0F4FF">Resolve</text>
  <text x="884" y="224" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">Resolving deletes the note and</text>
  <text x="884" y="250" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">its anchor.</text>
  <text x="884" y="276" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve"></text>
  <text x="884" y="302" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">What is left is the corrected</text>
  <text x="884" y="328" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">document, plus a git history</text>
  <text x="884" y="354" font-family="Consolas, &quot;DejaVu Sans Mono&quot;, Menlo, monospace" font-size="15" fill="#7B87A6" xml:space="preserve">that records the exchange.</text>
</svg>
